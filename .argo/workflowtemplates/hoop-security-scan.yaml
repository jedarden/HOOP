apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: hoop-security-scan
  namespace: argo-workflows
  annotations:
    description: "Security scanning: cargo audit, pnpm audit, trivy fs + image scan"
    planReference: "hoop-ttb.10.5"
spec:
  # Pod garbage collection: clean up pods after step completion
  podGC: OnPodCompletion

  # Archive failed workflows for 2-hour retention
  archiveOnFailure: true

  # 30-minute retention for successful workflows (1800 seconds)
  ttlSecondsAfterFinished: 1800

  arguments:
    parameters:
      - name: repo
        value: https://github.com/jedarden/HOOP.git
      - name: branch
        value: main
      - name: image_tag
        value: latest
      - name: fail_on_vuln
        value: "false"

  templates:
    - name: cargo-audit
      container:
        image: rust:1.83-bookworm
        workingDir: /workspace
        command:
          - sh
          - -c
          - |
            echo "=== Rust Dependency Audit (cargo audit) ==="
            cargo install cargo-audit
            cargo audit --json > /tmp/cargo-audit-report.json || EXIT_CODE=$? || EXIT_CODE=$?
            echo ""
            echo "=== Summary ==="
            cat /tmp/cargo-audit-report.json || echo "No vulnerabilities found"
            if [ "{{workflow.parameters.fail_on_vuln}}" = "true" ]; then
              cargo audit
            else
              echo "NOTE: Non-blocking scan (fail_on_vuln=false)"
              exit 0
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: reports
            mountPath: /tmp
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

    - name: pnpm-audit
      container:
        image: node:22-bookworm
        workingDir: /workspace/hoop-ui/web
        command:
          - sh
          - -c
          - |
            echo "=== npm Dependency Audit (pnpm audit) ==="
            npm install -g pnpm
            pnpm install --frozen-lockfile
            pnpm audit --json > /tmp/pnpm-audit-report.json 2>&1 || true
            echo ""
            echo "=== Summary ==="
            cat /tmp/pnpm-audit-report.json || echo "No vulnerabilities found"
            if [ "{{workflow.parameters.fail_on_vuln}}" = "true" ]; then
              pnpm audit --audit-level moderate
            else
              echo "NOTE: Non-blocking scan (fail_on_vuln=false)"
              exit 0
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: reports
            mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

    - name: trivy-fs
      container:
        image: aquasec/trivy:latest
        workingDir: /workspace
        command:
          - sh
          - -c
          - |
            echo "=== Trivy Filesystem Scan (secrets + vulns) ==="
            trivy fs --format json --output /tmp/trivy-fs-report.json \
              --skip-db-update \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              . || EXIT_CODE=$? || EXIT_CODE=$?
            echo ""
            echo "=== Summary ==="
            cat /tmp/trivy-fs-report.json || echo "Scan complete"
            if [ "{{workflow.parameters.fail_on_vuln}}" = "true" ]; then
              trivy fs --skip-db-update --scanners vuln,secret --severity HIGH,CRITICAL .
            else
              echo "NOTE: Non-blocking scan (fail_on_vuln=false)"
              exit 0
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: reports
            mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

    - name: trivy-image
      container:
        image: aquasec/trivy:latest
        command:
          - sh
          - -c
          - |
            echo "=== Trivy Image Scan ==="
            echo "Image: ronaldraygun/hoop:{{workflow.parameters.image_tag}}"
            trivy image --format json --output /tmp/trivy-image-report.json \
              --skip-db-update \
              --severity HIGH,CRITICAL \
              ronaldraygun/hoop:{{workflow.parameters.image_tag}} || EXIT_CODE=$? || EXIT_CODE=$?
            echo ""
            echo "=== Summary ==="
            cat /tmp/trivy-image-report.json || echo "Scan complete"
            if [ "{{workflow.parameters.fail_on_vuln}}" = "true" ]; then
              trivy image --skip-db-update --severity HIGH,CRITICAL ronaldraygun/hoop:{{workflow.parameters.image_tag}}
            else
              echo "NOTE: Non-blocking scan (fail_on_vuln=false)"
              exit 0
            fi
        volumeMounts:
          - name: reports
            mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

    - name: hoop-security-scan
      steps:
        - - name: checkout
            template: checkout
        - - name: cargo-audit
            template: cargo-audit
        - - name: pnpm-audit
            template: pnpm-audit
        - - name: trivy-fs
            template: trivy-fs
        - - name: trivy-image
            template: trivy-image

    - name: checkout
      container:
        image: alpine/git:2.49.0
        command:
          - sh
          - -c
          - |
            git clone --depth 1 --branch "{{workflow.parameters.branch}}" "{{workflow.parameters.repo}}" /workspace
            echo "Checked out {{workflow.parameters.branch}} at $(git rev-parse HEAD)"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    - name: weekly-scan
      steps:
        - - name: security-scan
            template: hoop-security-scan
            arguments:
              parameters:
                - name: repo
                  value: https://github.com/jedarden/HOOP.git
                - name: branch
                  value: main
                - name: image_tag
                  value: latest
                - name: fail_on_vuln
                  value: "false"

    - name: release-gate
      steps:
        - - name: security-scan
            template: hoop-security-scan
            arguments:
              parameters:
                - name: repo
                  value: https://github.com/jedarden/HOOP.git
                - name: branch
                  value: main
                - name: image_tag
                  value: latest
                - name: fail_on_vuln
                  value: "true"
