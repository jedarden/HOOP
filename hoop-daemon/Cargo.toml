[package]
name = "hoop-daemon"
version.workspace = true
edition.workspace = true

[features]
default = []
zero-write-v01 = []
create-only-write = []
# Internal feature for integration tests and load testing
testing = []
# OpenAPI spec generation (optional feature for API documentation)
openapi = []

[dependencies]
anyhow = "1.0"
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hoop-schema = { path = "../hoop-schema" }
hoop-ui = { path = "../hoop-ui" }
serde_json = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
bincode = "1.3"
shellexpand = "3.0"
dirs = "5.0"
notify = "6.1"
nix = { version = "0.27", features = ["signal"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
rusqlite = { version = "0.30", features = ["bundled"] }
sha2 = "0.10"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
hex = "0.4"
ignore = "0.4"
base64 = "0.22"
infer = "0.15"
once_cell = "1"
quick-xml = "0.36"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "html", "regex-fancy", "dump-load"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
hmac = "0.12"
zstd = "0.13"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.26"
fastembed = { version = "5", default-features = false, features = ["online", "ort-download-binaries"] }
flate2 = "1.0"
tar = "0.4"
glob = "0.3"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
utoipa-redoc = { version = "5", features = ["axum"] }
utoipa-rapidoc = { version = "5", features = ["axum"] }
fnv = "1"
jsonschema = "0.18"

[dev-dependencies]
tempfile = "3"
trybuild = "1.0"
serial_test = "3"
proptest = "1.0"
proptest-derive = "0.4"

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"
