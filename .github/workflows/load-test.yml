name: Load Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scale:
        description: 'Load test scale (medium/full)'
        required: false
        default: 'medium'
        type: choice
        options:
          - medium
          - full

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Load test for PRs (blocks merge on budget violations)
  load-test-pr:
    name: Load Test (Medium Scale)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run medium-scale load test
      run: cargo test --package hoop-daemon --test load_test_integration load_test_ci_performance_budgets -- --nocapture
      env:
        HOOP_LOAD_PROJECTS: 5
        HOOP_LOAD_WORKERS: 2
        HOOP_LOAD_BEADS: 50
        HOOP_LOAD_CADENCE_MS: 10

      # Test failure indicates performance budget violation - will block merge if configured as required check
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-pr-results
        path: |
          target/
        retention-days: 7

  # Full load test for main branch pushes (blocks merge on budget violations)
  load-test-main:
    name: Load Test (Full Scale)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run full-scale load test
      run: cargo test --package hoop-daemon --test load_test_integration load_test_ci_performance_budgets -- --nocapture
      env:
        HOOP_LOAD_TEST_FULL_SCALE: 1
        HOOP_LOAD_PROJECTS: 20
        HOOP_LOAD_WORKERS: 5
        HOOP_LOAD_BEADS: 300
        HOOP_LOAD_CADENCE_MS: 10

      # Test failure indicates performance budget violation - will block merge on main branch
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-main-results
        path: |
          target/
        retention-days: 30

  # Required load test for releases
  load-test-release:
    name: Load Test (Release Validation)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run full-scale load test (required for release)
      run: |
        echo "=== Running Load Test for Release ==="
        echo "Tag: ${{ github.ref_name }}"
        echo "Configuration: 20 projects × 5 workers × 300 beads"
        echo ""
        cargo test --package hoop-daemon --test load_test_integration load_test_ci_performance_budgets -- --nocapture
      env:
        HOOP_LOAD_TEST_FULL_SCALE: 1
        HOOP_LOAD_PROJECTS: 20
        HOOP_LOAD_WORKERS: 5
        HOOP_LOAD_BEADS: 300
        HOOP_LOAD_CADENCE_MS: 10

      # Test failure indicates performance budget violation - will block release
      continue-on-error: false

    - name: Upload release test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-release-${{ github.ref_name }}
        path: |
          target/
        retention-days: 90

  # Manual full-scale test via workflow_dispatch
  load-test-manual:
    name: Load Test (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run load test
      run: |
        SCALE="${{ github.event.inputs.scale || 'medium' }}"
        echo "Running $SCALE scale load test..."

        if [ "$SCALE" = "full" ]; then
          export HOOP_LOAD_TEST_FULL_SCALE=1
          export HOOP_LOAD_PROJECTS=20
          export HOOP_LOAD_WORKERS=5
          export HOOP_LOAD_BEADS=300
        else
          export HOOP_LOAD_PROJECTS=5
          export HOOP_LOAD_WORKERS=2
          export HOOP_LOAD_BEADS=50
        fi

        cargo test --package hoop-daemon --test load_test_integration load_test_ci_performance_budgets -- --nocapture

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-manual-${{ github.run_id }}
        path: |
          target/
        retention-days: 30

  # UI Performance budget tests via Playwright
  # This is now superseded by the integrated performance-budget-test job
  ui-performance-budget:
    name: UI Performance Budget (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false  # Disabled - use performance-budget-test job instead

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build daemon
      run: cargo build --release

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      working-directory: ./hoop-ui/web
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      working-directory: ./hoop-ui/web
      run: pnpm exec playwright install --with-deps chromium

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/playwright.config.ts') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Run Playwright performance budget tests
      working-directory: ./hoop-ui/web
      run: pnpm test:e2e performance-budget.spec.ts
      env:
        CI: true

      # Playwright test failures indicate performance budget violations
      continue-on-error: false

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-performance-report
        path: |
          hoop-ui/web/playwright-report/
          hoop-ui/web/test-results/
        retention-days: 30

  # Integrated performance budget test (medium scale for PRs)
  # Runs daemon under synthetic load, measures UI responsiveness and memory
  performance-budget-test:
    name: Performance Budget Test (${{ matrix.scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        scale:
          - medium  # For PRs
          - full    # For main/release

    # Skip full scale on PRs, only run on main/release
    # Skip medium scale on main (we only need full scale there)
    if: |
      (github.event_name == 'pull_request' && matrix.scale == 'medium') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.scale == 'full') ||
      (startsWith(github.ref, 'refs/tags/v') && matrix.scale == 'full') ||
      github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build daemon
      run: cargo build --release

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      working-directory: ./hoop-ui/web
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      working-directory: ./hoop-ui/web
      run: pnpm exec playwright install --with-deps chromium

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/playwright.config.ts') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Run integrated performance budget test
      run: .github/scripts/run-performance-budget-test.sh
      env:
        LOAD_TEST_SCALE: ${{ matrix.scale }}
        CI: true

      # Test failure indicates performance budget violation - will block merge
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-budget-test-${{ matrix.scale }}-${{ github.run_id }}
        path: |
          target/daemon.log
          target/load-gen.log
          hoop-ui/web/playwright-report/
          hoop-ui/web/test-results/
        retention-days: 30
