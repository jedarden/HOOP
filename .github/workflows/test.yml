name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changelog:
    name: Schema Change Changelog Check (§20)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check schema changes have CHANGELOG entry
      run: ./scripts/check-changelog.sh
      shell: bash

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run unit tests
      run: cargo test --lib --verbose -- --test-threads=1

    - name: Run projection file audit (static check for forbidden writes)
      run: cargo test -p hoop-daemon --test projection_file_audit --verbose

    - name: Run protocol contract tests (daemon ↔ hoop-mcp socket)
      run: |
        cargo test -p hoop-mcp --test protocol_contract --verbose
        cargo test -p hoop-daemon --test protocol_contract --verbose

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Verify tests complete within time budget
      run: |
        echo "Checking test execution time..."
        timeout 60s cargo test --lib 2>&1 | tee test-output.log
        if grep -q "test result:.*passed.*finished in" test-output.log; then
          TIME=$(grep "test result:.*finished in" test-output.log | sed -E 's/.*finished in ([0-9.]+)s.*/\1/')
          echo "Tests completed in ${TIME}s"
          if (( $(echo "$TIME < 60" | bc -l) )); then
            echo "✓ Tests completed within 60s budget"
          else
            echo "✗ Tests exceeded 60s budget"
            exit 1
          fi
        fi

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Generate coverage report
      run: cargo llvm-cov --lib --lcov --output-path lcov.info

    - name: Check coverage threshold
      run: |
        COVERAGE=$(cargo llvm-cov --lib --percentage --output-path lcov.info 2>&1 | grep -E '[0-9]+\.[0-9]+%' | sed -E 's/.*([0-9]+\.[0-9]+)%.*/\1/')
        echo "Coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE >= 80.0" | bc -l) )); then
          echo "✓ Coverage meets 80% threshold"
        else
          echo "✗ Coverage below 80% threshold"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./lcov.info
        fail_ci_if_error: false

  schema_drift:
    name: Schema Drift Test (Rust ↔ TypeScript)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Generate schema fixtures (Rust)
      run: |
        cd hoop-schema
        cargo test generate_schema_fixtures -- --ignored

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      working-directory: ./hoop-ui/web
      run: pnpm install --frozen-lockfile

    - name: Run TypeScript schema drift test
      working-directory: ./hoop-ui/web
      run: pnpm test schemaDrift.test.ts

    - name: Upload fixtures on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: schema-fixtures
        path: hoop-ui/web/src/__fixtures__/schema/

  beads_removal_recovery:
    name: Beads Removal Recovery Test (hoop-ttb.3.4.1)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run beads removal recovery integration test
      run: cargo test -p hoop-daemon --test beads_removal_recovery --verbose -- --test-threads=1
      timeout-minutes: 10
      env:
        RUST_BACKTRACE: 1

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: beads-removal-recovery-test-results
        path: |
          target/
        retention-days: 7

  e2e_tests:
    name: Playwright UI Tests (Desktop + Mobile)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build daemon binary
      run: |
        cargo build --release --bin hoop-daemon

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install Playwright browsers
      working-directory: ./hoop-ui/web
      run: npx playwright install --with-deps chromium

    - name: Install dependencies
      working-directory: ./hoop-ui/web
      run: pnpm install --frozen-lockfile

    - name: Run Playwright smoke tests
      working-directory: ./hoop-ui/web
      run: npm run test:e2e smoke-tests.spec.ts
      timeout-minutes: 15

    - name: Run Playwright visual regression tests
      working-directory: ./hoop-ui/web
      run: npm run test:e2e visual-regression.spec.ts --project=chromium --project=desktop-1920 --project=pixel6-mobile
      timeout-minutes: 15

    - name: Run Playwright mobile-specific tests
      working-directory: ./hoop-ui/web
      run: npm run test:e2e mobile-specific.spec.ts --project=pixel6-mobile
      timeout-minutes: 10

    - name: Upload Playwright test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          hoop-ui/web/playwright-report/
          hoop-ui/web/test-results/
        retention-days: 7

    - name: Upload Playwright screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-screenshots-failed
        path: |
          hoop-ui/web/test-results/
          hoop-ui/web/e2e/*-snapshots/
        retention-days: 7
