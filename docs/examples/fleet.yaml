# NEEDLE Fleet Configuration Example
# Location: ~/.needle/fleet.yaml (in each NEEDLE workspace)
#
# This file configures a NEEDLE worker fleet.
# HOOP observes these fleets but does not control them.
# See https://github.com/jedarden/NEEDLE for full documentation.

# Fleet name (used in HOOP UI)
name: example-fleet

# Workspace root containing .beads/ queue
workspace: /home/coding/myproject

# Worker pool configuration
workers:
  # Claude Code worker (Opus 4.7)
  - name: worker-opus
    model: claude-opus-4-7
    harness: claude-code
    concurrency: 1
    strands:
      - model: claude-opus-4-7
        harness: claude-code
    env:
      RUST_LOG: info
      CLAUDE_MODEL: claude-opus-4-7

  # Claude Code worker (Sonnet 4.6 - faster, cheaper)
  - name: worker-sonnet
    model: claude-sonnet-4-6
    harness: claude-code
    concurrency: 2
    strands:
      - model: claude-sonnet-4-6
        harness: claude-code
    env:
      RUST_LOG: info
      CLAUDE_MODEL: claude-sonnet-4-6

  # OpenCode worker (via ZAI proxy)
  - name: worker-opencode
    model: claude-sonnet-4-6
    harness: opencode
    concurrency: 1
    strands:
      - model: claude-sonnet-4-6
        harness: opencode
    env:
      RUST_LOG: info
      OPENCODE_BASE_URL: https://api.zai.example.com

# Tmux session configuration
tmux:
  session_name: needle-fleet
  base_path: /home/coding/.needle/sessions

# Claim behavior
claim:
  # Maximum concurrent claims across all workers
  max_concurrent: 3

  # Claim timeout (worker releases if no progress)
  timeout_minutes: 30

  # Retry behavior for failed claims
  retry:
    max_attempts: 3
    backoff_seconds: 60

# Health check configuration
health:
  # Interval between health checks
  interval_seconds: 30

  # Worker timeout before marking unhealthy
  timeout_seconds: 120

  # Auto-restart unhealthy workers
  auto_restart: true

# Cost tracking (HOOP reads this for budget calculations)
cost:
  # Per-model pricing (USD per 1M tokens)
  pricing:
    claude-opus-4-7:
      input: 15.0
      output: 75.0
      cache_read: 0.3
      cache_write: 3.75
    claude-sonnet-4-6:
      input: 3.0
      output: 15.0
      cache_read: 0.06
      cache_write: 0.30

# Logging configuration
logging:
  level: info
  format: json
  outputs:
    - type: file
      path: /home/coding/.needle/logs/fleet.log
      rotation:
        max_size_mb: 100
        max_files: 10
